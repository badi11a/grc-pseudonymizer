name: sync-demo

on:
  push:
    branches: [main]
    paths:
      - 'demo/index.html'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push demo to grc-pseudonymizer-demo
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/badi11a/grc-pseudonymizer-demo.git" demo-repo
          cp demo/index.html demo-repo/index.html
          cd demo-repo
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add index.html
          # Only commit if there are changes
          git diff --cached --quiet || git commit -m "chore: sync demo from grc-pseudonymizer@${GITHUB_SHA::7}"
          git push
